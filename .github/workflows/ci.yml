name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Enforce binary size budget
        shell: bash
        run: |
          exe=build/ActivityMonitor.exe
          budget=49152 # 48 KiB, as advertised in the README
          size=$(stat -c%s "$exe")
          echo "ActivityMonitor.exe is $size bytes (budget: $budget bytes)"
          if [ "$size" -gt "$budget" ]; then
            echo "::error::ActivityMonitor.exe grew to $size bytes, exceeding the $budget byte budget advertised in the README. Either shrink it back down or update the README claim."
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ActivityMonitor-dev-build
          path: build/ActivityMonitor.exe
          if-no-files-found: error
