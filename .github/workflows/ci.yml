name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Enforce binary size budget
        shell: bash
        run: |
          exe=build/Release/ActivityMonitor.exe
          budget=40960 # 40 KiB, as advertised in the README
          size=$(stat -c%s "$exe")
          echo "ActivityMonitor.exe is $size bytes (budget: $budget bytes)"
          if [ "$size" -gt "$budget" ]; then
            echo "::error::ActivityMonitor.exe grew to $size bytes, exceeding the $budget byte budget advertised in the README. Either shrink it back down or update the README claim."
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ActivityMonitor-dev-build
          path: build/Release/ActivityMonitor.exe
          if-no-files-found: error
