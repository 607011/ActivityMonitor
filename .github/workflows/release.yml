name: Release

# Only version tags trigger a release, e.g. v1.0.0, v1.2.3 (SemVer, no
# "-suffix"/build-metadata support needed here). Push a tag to publish:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write # to create the GitHub Release and upload assets

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAPP_VERSION=${{ steps.version.outputs.version }}

      - name: Build
        run: cmake --build build

      - name: Enforce binary size budget
        shell: bash
        run: |
          exe=build/ActivityMonitor.exe
          budget=49152 # 48 KiB, as advertised in the README
          size=$(stat -c%s "$exe")
          echo "ActivityMonitor.exe is $size bytes (budget: $budget bytes)"
          if [ "$size" -gt "$budget" ]; then
            echo "::error::ActivityMonitor.exe grew to $size bytes, exceeding the $budget byte budget advertised in the README. Either shrink it back down or update the README claim."
            exit 1
          fi

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zipName = "ActivityMonitor-$version-win64.zip"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/ActivityMonitor.exe dist/
          Copy-Item README.md dist/

          Compress-Archive -Path dist/* -DestinationPath $zipName -CompressionLevel Optimal
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Out-File "$zipName.sha256" -Encoding ascii -NoNewline

          echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ActivityMonitor ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.zip_name }}
            ${{ steps.package.outputs.zip_name }}.sha256
